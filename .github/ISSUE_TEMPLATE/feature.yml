name: Feature request
description: Suggest an improvement to Index Alpha.
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
